# Hôte virtuel de production : seul public/ est servi ; toutes les URL inconnues
# sont confiées au contrôleur frontal public/index.php (équivalent de public/.htaccess).
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    # Le reste du projet (config, vendor, reçus…) n'est jamais accessible.
    <Directory /var/www/html>
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>

    <FilesMatch "\.(css|js|svg|png|jpg|woff2?)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
